<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account status · Peermigo</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="platform-admin.css"><link rel="stylesheet" href="pm-dialogs.css">
</head>
<body class="pm-platform-admin"><header class="pm-admin-topbar"><div class="pm-admin-topbar-inner"><a class="pm-admin-brand" href="index.html">peermigo.</a><span class="pm-admin-grow"></span><a class="pm-admin-back" href="index.html">Back to Peermigo</a></div></header>
<main class="pm-admin-shell"><section class="pm-admin-panel-card" style="max-width:660px;margin:55px auto;padding:30px"><span class="pm-admin-eyebrow">YOUR ACCOUNT</span><h1 id="statusTitle">Checking account status…</h1><p id="statusInfo" aria-live="polite">Verifying your account with Peermigo.</p><p id="statusReason"></p><p id="appealState"></p>
<form id="appealForm" hidden><label for="appealText" style="display:block;font-weight:700;margin:22px 0 9px">Request a review</label><textarea id="appealText" required minlength="20" maxlength="1000" rows="6" style="box-sizing:border-box;width:100%;padding:12px;border-radius:10px" placeholder="Explain why this decision should be reviewed (20–1000 characters)."></textarea><button class="pm-admin-primary" style="margin-top:15px" id="appealSubmit">Submit appeal</button></form><p id="appealResult" role="status"></p></section></main>
<script defer src="pm-dialogs.js"></script><script src="config.js"></script><script src="api.js"></script><script>
(async()=>{const el=id=>document.getElementById(id);try{await PM.backend.init();const c=PM.backend.requireClient(),auth=await c.auth.getUser();if(!auth.data?.user){el('statusTitle').textContent='Sign in required';el('statusInfo').textContent='Please sign in to view your account status.';return}const {data,error}=await c.rpc('pm_my_moderation_status');if(error)throw error;const st=data.status;el('statusTitle').textContent=({active:'Account active',suspended:'Account suspended',disabled:'Account disabled',deactivated:'Account deactivated'})[st]||'Account status';el('statusInfo').textContent=st==='suspended'?'Your access is temporarily restricted'+(data.until?' until '+new Date(data.until).toLocaleString('en-ZA'):'')+'.':st==='disabled'?'Your Peermigo account access has been disabled.':st==='active'?'Your account is currently active.':'Contact Peermigo support if you need help.';if(data.notice?.reason)el('statusReason').textContent='Reason: '+data.notice.reason;const appeal=data.appeal;if(appeal){el('appealState').textContent='Latest appeal: '+appeal.status+(appeal.reviewer_note?' — '+appeal.reviewer_note:'');}if(['suspended','disabled'].includes(st)&&!['new','reviewing'].includes(appeal?.status)){el('appealForm').hidden=false;}el('appealForm').addEventListener('submit',async e=>{e.preventDefault();const btn=el('appealSubmit');btn.disabled=true;try{const {error}=await c.rpc('pm_submit_moderation_appeal',{p_message:el('appealText').value.trim()});if(error)throw error;el('appealResult').textContent='Your appeal was submitted for administrator review.';el('appealForm').hidden=true;}catch(err){el('appealResult').textContent=err.message;}finally{btn.disabled=false;}});}catch(err){el('statusTitle').textContent='Status unavailable';el('statusInfo').textContent=err.message;}})();
</script></body></html>
